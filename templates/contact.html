{% extends "base.html" %}
{% block title %}Contact Us — Western Prime Bank{% endblock %}
{% block body %}
<section class="page-banner-area section-padding" style="padding-top:160px;">
    <div class="container">
        <div class="section-title text-center">
            <h2 class="wow fadeInUp">Contact Us</h2>
            <p class="wow fadeInUp" data-wow-delay=".3s">Questions about loans or accounts? Send us a message and we will get back to you.</p>
        </div>
    </div>
</section>
<section class="contact-area section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-12">
                <div class="contact-form-wrapper wow fadeInUp" data-wow-delay=".5s">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    {% if success %}
                    <div class="alert alert-success">{{ success }}</div>
                    {% endif %}
                    <form action="/contact" method="post" class="contact-form">
                        <div class="row">
                            <div class="col-md-6 col-12">
                                <div class="single-form">
                                    <input type="text" name="name" placeholder="Your Name" value="{{ form_data.name or '' if form_data else '' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6 col-12">
                                <div class="single-form">
                                    <input type="email" name="email" placeholder="Your Email" value="{{ form_data.email or '' if form_data else '' }}" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="single-form">
                                    <input type="text" name="subject" placeholder="Subject" value="{{ form_data.subject or '' if form_data else '' }}">
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="single-form">
                                    <textarea name="message" rows="5" placeholder="Your Message" required>{{ form_data.message or '' if form_data else '' }}</textarea>
                                </div>
                            </div>
                            <div class="col-md-6 col-12">
                                <div class="single-form">
                                    <input type="email" name="reply_to" placeholder="Reply-to email (optional)" value="{{ form_data.reply_to or '' if form_data else '' }}">
                                </div>
                            </div>
                            <div class="col-12 text-center">
                                <button type="submit" class="btn btn-one">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
