{% extends "base.html" %}
{% block title %}Account Login — Western Prime Bank{% endblock %}
{% block body %}
<section class="page-banner-area section-padding" style="padding-top:160px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-9 col-12">
                <div class="section-title text-center">
                    <h2 class="wow fadeInUp">Account Login</h2>
                    <p class="wow fadeInUp" data-wow-delay=".3s">Access your loan applications and account dashboard.</p>
                </div>
                <div class="contact-form-wrapper wow fadeInUp" data-wow-delay=".5s">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form action="/login" method="post" class="contact-form">
                        <div class="row">
                            <div class="col-12">
                                <div class="single-form">
                                    <input type="email" name="email" placeholder="Email Address" value="{{ email or '' }}" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="single-form">
                                    <input type="password" name="password" placeholder="Password" required>
                                </div>
                            </div>
                            <div class="col-12 text-center">
                                <button type="submit" class="btn btn-one">Login</button>
                            </div>
                        </div>
                    </form>
                    <p class="text-center mt-20">Don't have an account? <a href="/signup">Sign up here</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
